name: protocol

# Runs only when the protocol crate, the shared manifests/lockfile that pin it,
# or this workflow change. It has no dependencies of its own, so nothing else
# triggers it.
on:
  push:
    branches: [ master, main ]
    paths:
      - 'chainloader-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - '.github/workflows/protocol.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'chainloader-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - '.github/workflows/protocol.yml'

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable, beta, nightly]
        exclude:
          # Trim the matrix: nightly on Windows is the least informative cell.
          - os: windows-latest
            rust: nightly
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Cache
      uses: Swatinem/rust-cache@v2
    - name: Test
      run: cargo test -p chainloader-protocol --all-features
    - name: Test (release)
      run: cargo test -p chainloader-protocol --all-features --release

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Cache
      uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy -p chainloader-protocol --all-targets --all-features -- -D warnings
    - name: Format
      run: cargo fmt -p chainloader-protocol --check
    - name: Docs
      # Catches broken intra-doc links, which nothing else does.
      run: cargo doc -p chainloader-protocol --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings
