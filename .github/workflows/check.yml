name: Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy, rustfmt
    - name: Cache
      uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Format
      run: cargo fmt --check
    - name: Docs
      # Catches broken intra-doc links, which nothing else does.
      run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings

  loader:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust (bare-metal)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: aarch64-unknown-none
        components: clippy, rustfmt, llvm-tools
    - name: Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: loader
    - name: Build loader
      working-directory: loader
      run: cargo build --release
    - name: Clippy loader
      working-directory: loader
      # No --all-targets: a #![no_main] bare-metal binary has no test harness to
      # build for aarch64-unknown-none.
      run: cargo clippy -- -D warnings
    - name: Format loader
      working-directory: loader
      run: cargo fmt --check
