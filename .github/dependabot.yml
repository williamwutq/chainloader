version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
  # The bare-metal loader is excluded from the root workspace, so it has its own
  # manifest for Dependabot to track.
  - package-ecosystem: "cargo"
    directory: "/loader"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
